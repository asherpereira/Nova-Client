name: Windows Client

on:
  push:
    branches: [ main, "bootstrap/**" ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Nova.Client.slnx
      - name: Build
        run: dotnet build Nova.Client.slnx --configuration Release --no-restore --arch x64
